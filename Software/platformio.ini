[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.partitions = default.csv

build_type = release
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
lib_ldf_mode = chain

lib_deps =
    earlephilhower/ESP8266Audio @ 1.9.7